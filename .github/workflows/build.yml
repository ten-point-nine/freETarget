# Tests the PC software on Windows, Linux and macOS and builds the downloadable packages
# of the desktop application and of the target simulator for all of them, each for Intel/AMD (x64)
# and for ARM processors.
#
# - every push and pull request (except changes to the documentation only): tests and packages.
#   the packages can be downloaded from the page of the workflow run ("Artifacts")
# - a tag that starts with "pc-v" (for example pc-v4.12.2): the packages are also attached to a release
#   and get the version of the tag. its major number has to be the one of the project file
# - can be started by hand from the "Actions" page

name: Build

on:
  push:
    branches: ['**']
    tags: ['pc-v*']
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # the reports and the target drawings need a sans serif font
      - name: Install fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fontconfig

      - name: Build
        run: dotnet build freETarget.sln --configuration Release

      - name: Test the core
        run: dotnet test freETarget.Tests --configuration Release --no-build

      - name: Test the desktop application
        run: dotnet test freETarget.Desktop.Tests --configuration Release --no-build

  package:
    name: Package ${{ matrix.runtime }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: win-x64,     os: windows-latest }
          - { runtime: win-arm64,   os: windows-latest }
          - { runtime: linux-x64,   os: ubuntu-latest }
          - { runtime: linux-arm64, os: ubuntu-latest }
          # the macOS application gets its icon and its ad-hoc signature from tools that only exist on macOS
          - { runtime: osx-x64,     os: macos-latest }
          - { runtime: osx-arm64,   os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # the desktop application and the target simulator. a release gets the version of its tag,
      # everything else the version of the project file
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/pc-v* ]]; then
            export FET_VERSION="${GITHUB_REF_NAME#pc-v}"
          fi
          packaging/package.sh ${{ matrix.runtime }}

      - uses: actions/upload-artifact@v4
        with:
          name: freETarget-${{ matrix.runtime }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/pc-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
